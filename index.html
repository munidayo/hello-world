<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocxPeek — ローカル docx ビューア</title>
    <meta name="description" content="DocxPeek: ブラウザだけで .docx を読むミニマルなビューア" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2b579a" />
    <meta name="apple-mobile-web-app-title" content="DocxPeek" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <header class="title-bar">
      <div class="title-left">
        <span class="app-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <rect x="3" y="2" width="18" height="20" rx="2" fill="#ffffff" fill-opacity="0.18" />
            <rect x="6" y="5" width="12" height="1.2" rx="0.6" fill="rgba(255,255,255,0.55)" />
            <rect x="6" y="18" width="12" height="1.2" rx="0.6" fill="rgba(255,255,255,0.55)" />
            <circle cx="9" cy="13" r="2.4" fill="#ffffff" />
            <circle cx="15" cy="13" r="2.4" fill="#ffffff" />
            <circle cx="9" cy="13" r="1.1" fill="#1f3f6b" />
            <circle cx="15" cy="13" r="1.1" fill="#1f3f6b" />
          </svg>
        </span>
        <span class="app-title">DocxPeek</span>
        <span class="doc-name" id="docName">無題のドキュメント</span>
      </div>
      <div class="title-right">
        <span class="muted small" id="docStats"></span>
      </div>
    </header>

    <nav class="ribbon" aria-label="ツールバー">
      <button class="rbtn primary" id="openBtn" type="button" title="docx を開く (Ctrl+O)">
        <span class="ico">📂</span>開く
      </button>

      <div class="ribbon-group zoom-group">
        <button class="rbtn icon-only" id="zoomOutBtn" type="button" title="ズームアウト (Ctrl+−)" disabled>−</button>
        <span class="zoom-value" id="zoomValue">100%</span>
        <button class="rbtn icon-only" id="zoomInBtn" type="button" title="ズームイン (Ctrl+＋)" disabled>＋</button>
      </div>

      <div class="ribbon-spacer"></div>

      <div class="ribbon-group right">
        <input
          type="search"
          id="searchInput"
          class="search"
          placeholder="本文を検索… (Ctrl+F)"
          aria-label="本文を検索"
          disabled
        />
        <span class="search-counter muted small" id="searchCounter"></span>
        <button class="rbtn icon-only" id="searchPrevBtn" type="button" title="前へ (Shift+Enter)" disabled>◀</button>
        <button class="rbtn icon-only" id="searchNextBtn" type="button" title="次へ (Enter)" disabled>▶</button>

        <label class="rbtn toggle" title="ダークモード">
          <input type="checkbox" id="darkToggle" />
          <span class="ico">🌙</span>
        </label>
      </div>
    </nav>

    <main class="workspace" id="workspace">
      <!-- 何も読み込まれていないときのウェルカム画面 -->
      <section class="welcome" id="welcome" aria-label="ファイルを開く">
        <div class="welcome-card">
          <div class="welcome-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="64" height="64">
              <rect x="8" y="4" width="48" height="56" rx="6" fill="#2b579a" />
              <rect x="16" y="12" width="32" height="3" rx="1.5" fill="rgba(255,255,255,0.7)" />
              <rect x="16" y="49" width="32" height="3" rx="1.5" fill="rgba(255,255,255,0.7)" />
              <circle cx="24" cy="32" r="7" fill="#ffffff" />
              <circle cx="40" cy="32" r="7" fill="#ffffff" />
              <circle cx="25.5" cy="33" r="3.2" fill="#1f3f6b" />
              <circle cx="41.5" cy="33" r="3.2" fill="#1f3f6b" />
              <circle cx="26.5" cy="32" r="1" fill="#ffffff" />
              <circle cx="42.5" cy="32" r="1" fill="#ffffff" />
            </svg>
          </div>
          <h1>DocxPeek</h1>
          <p class="muted">
            ローカル docx ビューア。<code>.docx</code> ファイルを選んで、紙面でちらっと覗き見しましょう。
            ファイルは外部に送信されず、すべてブラウザ内で処理されます。
          </p>
          <div
            id="dropzone"
            class="welcome-dropzone"
            tabindex="0"
            role="button"
            aria-label="docx ファイルをドラッグ＆ドロップ、またはクリックで選択"
          >
            <div class="dz-emoji" aria-hidden="true">📄</div>
            <p class="dz-title">ここに <strong>.docx</strong> をドロップ</p>
            <p class="muted small">またはクリックしてファイルを選択</p>
          </div>
          <p class="muted small tip">
            <kbd>Ctrl</kbd>＋<kbd>O</kbd> で開く ／
            <kbd>Ctrl</kbd>＋<kbd>F</kbd> で検索 ／
            <kbd>Ctrl</kbd>＋ホイール でズーム
          </p>
        </div>
      </section>

      <!-- 紙面 -->
      <section
        id="paperWrap"
        class="paper-wrap hidden"
        aria-label="ドキュメント表示"
      >
        <div id="paperScale" class="paper-scale">
          <article id="paper" class="paper" aria-live="polite"></article>
        </div>
      </section>

      <!-- 読み込み中 / エラー -->
      <div id="status" class="status hidden" role="status" aria-live="polite"></div>
    </main>

    <footer class="status-bar">
      <span id="footStatus">準備完了</span>
      <span class="spacer"></span>
      <span class="muted small" id="footMeta"></span>
    </footer>

    <input
      type="file"
      id="fileInput"
      accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      hidden
    />

    <!-- mammoth.js: docx -> HTML 変換 -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
