<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Word — ローカル docx ビューア</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='2' width='18' height='20' rx='2' fill='%232b579a'/%3E%3Ctext x='12' y='17' text-anchor='middle' font-family='Arial' font-size='12' font-weight='bold' fill='white'%3EW%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="title-bar">
      <div class="title-left">
        <span class="app-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <rect x="3" y="2" width="18" height="20" rx="2" fill="#2b579a" />
            <text
              x="12"
              y="17"
              text-anchor="middle"
              font-family="Arial"
              font-size="12"
              font-weight="bold"
              fill="white"
            >W</text>
          </svg>
        </span>
        <span class="app-title">Mini Word</span>
        <span class="doc-name" id="docName">無題のドキュメント</span>
      </div>
      <div class="title-right">
        <span class="muted small" id="docStats"></span>
      </div>
    </header>

    <nav class="ribbon" aria-label="ツールバー">
      <div class="ribbon-group">
        <button class="rbtn primary" id="openBtn" type="button" title="docx を開く (Ctrl+O)">
          <span class="ico">📂</span>開く
        </button>
        <button class="rbtn" id="printBtn" type="button" title="印刷 (Ctrl+P)" disabled>
          <span class="ico">🖨️</span>印刷
        </button>
        <button class="rbtn" id="downloadHtmlBtn" type="button" title="HTML として保存" disabled>
          <span class="ico">💾</span>HTML 保存
        </button>
      </div>

      <div class="ribbon-sep" aria-hidden="true"></div>

      <div class="ribbon-group zoom-group">
        <button class="rbtn icon-only" id="zoomOutBtn" type="button" title="ズームアウト" disabled>−</button>
        <span class="zoom-value" id="zoomValue">100%</span>
        <button class="rbtn icon-only" id="zoomInBtn" type="button" title="ズームイン" disabled>＋</button>
        <button class="rbtn small" id="fitWidthBtn" type="button" title="幅に合わせる" disabled>幅に合わせる</button>
      </div>

      <div class="ribbon-sep" aria-hidden="true"></div>

      <div class="ribbon-group">
        <label class="rbtn toggle" title="ダークモード">
          <input type="checkbox" id="darkToggle" />
          <span class="ico">🌙</span>ダーク
        </label>
      </div>

      <div class="ribbon-spacer"></div>

      <div class="ribbon-group right">
        <input
          type="search"
          id="searchInput"
          class="search"
          placeholder="本文を検索…"
          aria-label="本文を検索"
          disabled
        />
        <span class="search-counter muted small" id="searchCounter"></span>
        <button class="rbtn icon-only" id="searchPrevBtn" type="button" title="前へ" disabled>◀</button>
        <button class="rbtn icon-only" id="searchNextBtn" type="button" title="次へ" disabled>▶</button>
      </div>
    </nav>

    <main class="workspace" id="workspace">
      <!-- 何も読み込まれていないときのウェルカム画面 -->
      <section class="welcome" id="welcome" aria-label="ファイルを開く">
        <div class="welcome-card">
          <div class="welcome-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="64" height="64">
              <rect x="8" y="4" width="48" height="56" rx="4" fill="#2b579a" />
              <rect x="14" y="14" width="36" height="3" rx="1.5" fill="rgba(255,255,255,0.85)" />
              <rect x="14" y="22" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.7)" />
              <rect x="14" y="30" width="32" height="3" rx="1.5" fill="rgba(255,255,255,0.7)" />
              <rect x="14" y="38" width="24" height="3" rx="1.5" fill="rgba(255,255,255,0.55)" />
              <rect x="14" y="46" width="30" height="3" rx="1.5" fill="rgba(255,255,255,0.55)" />
            </svg>
          </div>
          <h1>ローカル docx ビューア</h1>
          <p class="muted">
            <code>.docx</code> ファイルを選んで、Word のように紙面で読みましょう。
            ファイルは外部に送信されず、すべてブラウザ内で処理されます。
          </p>
          <div
            id="dropzone"
            class="welcome-dropzone"
            tabindex="0"
            role="button"
            aria-label="docx ファイルをドラッグ＆ドロップ、またはクリックで選択"
          >
            <div class="dz-emoji" aria-hidden="true">📄</div>
            <p class="dz-title">ここに <strong>.docx</strong> をドロップ</p>
            <p class="muted small">またはクリックしてファイルを選択</p>
          </div>
          <p class="muted small tip">
            ヒント: 開いたあとは <kbd>Ctrl</kbd>＋<kbd>F</kbd>で検索、
            <kbd>Ctrl</kbd>＋<kbd>P</kbd>で印刷できます。
          </p>
        </div>
      </section>

      <!-- 紙面 -->
      <section
        id="paperWrap"
        class="paper-wrap hidden"
        aria-label="ドキュメント表示"
      >
        <div id="paperScale" class="paper-scale">
          <article id="paper" class="paper" aria-live="polite"></article>
        </div>
      </section>

      <!-- 読み込み中 / エラー -->
      <div id="status" class="status hidden" role="status" aria-live="polite"></div>
    </main>

    <footer class="status-bar">
      <span id="footStatus">準備完了</span>
      <span class="spacer"></span>
      <span class="muted small" id="footMeta"></span>
    </footer>

    <input
      type="file"
      id="fileInput"
      accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      hidden
    />

    <!-- mammoth.js: docx -> HTML 変換 -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
